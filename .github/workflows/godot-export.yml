name: Build Godot APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip project
        run: unzip -q dhaka-run.zip -d .
      - name: Import and export APK
        working-directory: dhaka-run
        run: |
          godot --headless --import
          mkdir -p ../build
          godot --headless --export-debug "Android" ../build/dhaka-run.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-run-apk
          path: build/*.apk
