name: Build Godot APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
          include-templates: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip project
        run: unzip -q dhaka-run.zip -d .
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Android, L=Unknown, ST=Unknown, C=US"
      - name: Use prebuilt Android template
        working-directory: dhaka-run
        run: |
          sed -i 's/gradle_build\/use_gradle_build=true/gradle_build\/use_gradle_build=false/' export_presets.cfg
          grep 'gradle_build/use_gradle_build=false' export_presets.cfg
      - name: Import and export APK
        working-directory: dhaka-run
        run: |
          godot --headless --import
          mkdir -p ../build
          godot --headless --export-debug "Android" ../build/dhaka-run.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-run-apk
          path: build/*.apk
